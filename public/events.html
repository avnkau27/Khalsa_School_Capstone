<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Photos | SGSS Khalsa School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/vendor/browser-image-compression/dist/browser-image-compression.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen" data-page="events">
  <header class="site-navbar">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="font-bold text-lg">SGSS Khalsa School</a>
      <div class="flex flex-wrap items-center gap-1">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link active" href="/events.html">Events</a>
        <a class="nav-link" href="/langar.html">Langar Seva</a>
        <a id="flyer-nav-link" class="nav-link hidden" href="/flyer.html">AI Flyer Maker</a>
      </div>
      <div class="flex items-center gap-2">
        <span id="nav-user" class="hidden text-xs text-indigo-100"></span>
        <button id="nav-login" class="px-3 py-1.5 rounded-lg bg-white text-indigo-900 text-sm font-semibold">Login</button>
        <button id="nav-role" class="hidden px-3 py-1.5 rounded-lg bg-amber-500 text-white text-xs font-semibold">Switch Role</button>
        <button id="nav-logout" class="hidden px-3 py-1.5 rounded-lg border border-indigo-300 text-xs font-semibold">Logout</button>
      </div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
        <div>
          <h1 class="text-3xl font-bold text-indigo-950">Event Photo Pipeline</h1>
          <p class="text-sm text-slate-500 mt-1">Database read/write with compressed image storage.</p>
        </div>
        <a href="/api/photos/zip" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold text-center">Download All as ZIP</a>
      </div>

      <form id="upload-form" class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
        <input id="photo-title" type="text" placeholder="Event title" required class="px-3 py-2 border border-slate-300 rounded-lg text-sm" />
        <input id="photo-file" type="file" accept="image/*" required class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm bg-white" />
        <button id="upload-btn" type="submit" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Compress &amp; Upload</button>
      </form>
      <p id="upload-feedback" class="text-sm text-slate-600 mb-4"></p>
      <p id="rbac-feedback" class="hidden mb-4 p-3 rounded-lg bg-slate-100 text-sm font-medium"></p>
      <div id="photo-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
