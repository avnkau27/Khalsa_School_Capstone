<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events | SGSS Khalsa School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen" data-page="events">
  <header class="site-navbar">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="font-bold text-lg">SGSS Khalsa School</a>
      <div class="flex flex-wrap items-center gap-1">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link active" href="/events.html">Events</a>
        <a class="nav-link" href="/langar.html">Langar Seva</a>
        <a id="flyer-nav-link" class="nav-link hidden" href="/flyer.html">AI Flyer Maker</a>
      </div>
      <div class="flex items-center gap-2">
        <span id="nav-user" class="hidden text-xs text-indigo-100"></span>
        <button id="nav-login" class="px-3 py-1.5 rounded-lg bg-white text-indigo-900 text-sm font-semibold">Login</button>
        <button id="nav-logout" class="hidden px-3 py-1.5 rounded-lg border border-indigo-300 text-xs font-semibold">Logout</button>
      </div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
        <div>
          <h1 class="text-3xl font-bold text-indigo-950">Community Events</h1>
          <p class="text-sm text-slate-500 mt-1">Choose an event to view and share its photos.</p>
        </div>
        <button id="create-event-button" type="button" class="hidden px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Create event</button>
      </div>

      <p id="events-feedback" class="hidden mb-4 p-3 rounded-lg bg-slate-100 text-sm font-medium"></p>
      <div id="events-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

    <dialog id="create-event-dialog" class="w-[min(42rem,calc(100%-2rem))] rounded-2xl p-0 shadow-xl backdrop:bg-slate-950/50">
      <form id="create-event-form" class="p-6 sm:p-8">
        <div class="flex items-start justify-between gap-4 mb-5">
          <div>
            <h2 class="text-2xl font-bold text-indigo-950">Create an event</h2>
            <p class="text-sm text-slate-500 mt-1">Event creator and timestamps are filled in automatically.</p>
          </div>
          <button id="close-event-dialog" type="button" aria-label="Close" class="text-2xl text-slate-500 leading-none">&times;</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="text-sm font-medium text-slate-700 sm:col-span-2">
            Event name
            <input name="eventName" type="text" maxlength="255" required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" />
          </label>
          <label class="text-sm font-medium text-slate-700 sm:col-span-2">
            Description
            <textarea name="description" rows="3" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg"></textarea>
          </label>
          <label class="text-sm font-medium text-slate-700 sm:col-span-2">
            Location
            <input name="location" type="text" maxlength="255" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" />
          </label>
          <label class="text-sm font-medium text-slate-700">
            Starts
            <input name="dateStart" type="datetime-local" required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" />
          </label>
          <label class="text-sm font-medium text-slate-700">
            Ends
            <input name="dateEnd" type="datetime-local" required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" />
          </label>
          <label class="sm:col-span-2 flex items-center gap-2 text-sm font-medium text-slate-700">
            <input name="isPublished" type="checkbox" checked class="h-4 w-4 accent-indigo-600" />
            Publish this event
          </label>
        </div>
        <p id="create-event-feedback" class="hidden mt-4 text-sm text-red-600"></p>
        <div class="flex justify-end gap-3 mt-6">
          <button id="cancel-event-dialog" type="button" class="px-4 py-2 rounded-lg border border-slate-300 text-sm font-semibold">Cancel</button>
          <button id="save-event-button" type="submit" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">Create event</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/app.js"></script>
</body>
</html>
